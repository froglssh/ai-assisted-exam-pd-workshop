const COUNT_RANGE = [6, 15];

const rollFrom = (options, prev) => {
  const pool = options.length > 1 ? options.filter(o => o.value !== prev) : options;
  return pool[Math.floor(Math.random() * pool.length)].value;
};
const rollCount = (prev) => {
  let n; do { n = COUNT_RANGE[0] + Math.floor(Math.random() * (COUNT_RANGE[1] - COUNT_RANGE[0] + 1)); } while (n === prev);
  return n;
};
const defaultSmart = () => {
  const s = {};
  Object.entries(SMART_FIELDS).forEach(([k, c]) => { s[k] = { mode: 'pick', value: c.def, rolled: c.def, custom: '' }; });
  s.slideCount = { mode: 'pick', value: 10, rolled: 10, custom: '' };
  return s;
};
const findOpt = (k, v) => SMART_FIELDS[k].options.find(o => o.value === v) || SMART_FIELDS[k].options[0];
const resolveSmart = (smart, k) => {
  const s = smart[k];
  if (k === 'slideCount') {
    if (s.mode === 'custom' && s.custom.trim()) return { text: s.custom.trim(), mode: 'custom' };
    return { text: `${s.mode === 'random' ? s.rolled : s.value} 頁`, mode: s.mode === 'custom' ? 'pick' : s.mode };
  }
  if (s.mode === 'custom' && s.custom.trim()) return { text: s.custom.trim(), mode: 'custom', opt: null };
  const o = findOpt(k, s.mode === 'random' ? s.rolled : s.value);
  return { text: o.desc ? `${o.label}（${o.desc}）` : o.label, short: o.label, mode: s.mode === 'custom' ? 'pick' : s.mode, opt: o };
};

    P(`- 產出媒介：${R('infoMedia')}`);
    P();
    P('■ 企劃內容');
    P('1. 主標題與副標題：點出單元核心精神、吸睛易記。');
    P('2. 中央視覺結構：說明主軸、動線與圖像配置。');
    P('3. 資訊區塊：列出 3–5 個必須標註的關鍵概念、數據或關係。');
    P('4. 生成用提示詞或程式碼：依「產出媒介」交付——AI 繪圖請給英文 Prompt；Mermaid／HTML／SVG 請給完整可執行的程式碼。');
  }

  if (st.indicators.length) { P(); P(`■ 對應核心素養：${st.indicators.join('、')}`); }
  if (st.notes.trim()) { P(); P('■ 特別需求'); P(st.notes.trim()); }
  P();
  P('■ 共同規範：使用繁體中文與台灣用語；科學與史實內容須正確；若來源資料不足以完成任務，請先列出需要我補充的資訊。');
  return lines.join('\n');
}

/* ================= 小元件 ================= */
const Section = ({ no, title, sub, right, children }) => (
  <section className="card p-5 sm:p-6 rise">
    <header className="flex items-start gap-3 mb-5">
      <div className="sec-no">{no}</div>
      <div className="flex-1 min-w-0">
        <h3 className="serif text-lg font-black leading-snug">{title}</h3>
        {sub && <p className="hint mt-0.5">{sub}</p>}
      </div>
      {right}
    </header>
    {children}
  </section>
);

const Chips = ({ items, value, onPick, multi }) => (
  <div className="flex flex-wrap gap-2">
    {items.map(it => {
      const v = typeof it === 'string' ? it : it.v;
      const on = multi ? value.includes(v) : value === v;
      return <button key={v} type="button" className={`chip ${on ? 'on' : ''}`} onClick={() => onPick(v)} title={it.d || ''}>{v}{it.d && <span className="opacity-70 text-xs">· {it.d}</span>}</button>;
    })}
  </div>
);

function OptionSelect({ options, value, onChange }) {
  const groups = [...new Set(options.map(o => o.group).filter(Boolean))];
  return (
    <select className="sel" value={value} onChange={e => onChange(e.target.value)}>
      {groups.length ? groups.map(g => (
        <optgroup key={g} label={g}>{options.filter(o => o.group === g).map(o => <option key={o.value} value={o.value}>{o.label}</option>)}</optgroup>
      )) : options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
    </select>
  );
}

function ModeSwitch({ mode, onMode }) {
  return (
    <div className="seg" role="tablist">
      <button type="button" className={mode === 'pick' ? 'on' : ''} onClick={() => onMode('pick')}>指定</button>
      <button type="button" className={`dice ${mode === 'random' ? 'on rnd' : ''}`} onClick={() => onMode('random')}>🎲 隨機</button>
      <button type="button" className={mode === 'custom' ? 'on cus' : ''} onClick={() => onMode('custom')}>✏️ 自訂</button>
    </div>
  );
}

function SmartField({ k, smart, setSmart }) {
  const cfg = SMART_FIELDS[k]; const s = smart[k];
  const onMode = (mode) => setSmart(k, mode === 'random' ? { mode, rolled: rollFrom(cfg.options, s.rolled) } : { mode });
  const shown = findOpt(k, s.mode === 'random' ? s.rolled : s.value);
  return (
    <div className={`field m-${s.mode}`}>
      <div className="flex flex-wrap items-center justify-between gap-2 mb-2.5">
        <div>
          <div className="font-bold text-[0.95rem]">{cfg.label}</div>
          <div className="hint">{cfg.hint}</div>
        </div>
        <ModeSwitch mode={s.mode} onMode={onMode} />
      </div>
      {s.mode === 'pick' && (<>
        <OptionSelect options={cfg.options} value={s.value} onChange={v => setSmart(k, { value: v })} />
        {shown.desc && <div className="hint mt-1.5 pl-1">↳ {shown.desc}</div>}
      </>)}
      {s.mode === 'random' && (
        <div className="rollbox">
          <span className="text-xl">🎲</span>
          <div className="flex-1 min-w-0">
            <div className="font-bold text-[#92400e] leading-snug">{shown.label}</div>
            {shown.desc && <div className="hint">{shown.desc}</div>}
          </div>
          <button type="button" className="btn btn-ghost dice" onClick={() => setSmart(k, { rolled: rollFrom(cfg.options, s.rolled) })}><IDice size={15} />重抽</button>
        </div>
      )}
      {s.mode === 'custom' && (
        <input className="inp" autoFocus placeholder={cfg.ph} value={s.custom} onChange={e => setSmart(k, { custom: e.target.value })} />
      )}
      {s.mode === 'custom' && !s.custom.trim() && <div className="hint mt-1.5 pl-1">尚未輸入時，會暫用「{findOpt(k, s.value).label}」</div>}
    </div>
  );
}

function SmartCount({ smart, setSmart }) {
  const s = smart.slideCount;
  const onMode = (mode) => setSmart('slideCount', mode === 'random' ? { mode, rolled: rollCount(s.rolled) } : { mode });
  return (
    <div className={`field m-${s.mode}`}>
      <div className="flex flex-wrap items-center justify-between gap-2 mb-2.5">
        <div><div className="font-bold text-[0.95rem]">簡報頁數</div><div className="hint">一堂 50 分鐘課約 10–12 頁</div></div>
        <ModeSwitch mode={s.mode} onMode={onMode} />
      </div>
      {s.mode === 'pick' && (<div>
        <div className="flex items-baseline gap-2 mb-1"><span className="serif text-3xl font-black" style={{ color: 'var(--accent)' }}>{s.value}</span><span className="hint">頁</span></div>
        <input type="range" min="3" max="25" value={s.value} onChange={e => setSmart('slideCount', { value: +e.target.value })} />
        <div className="flex justify-between hint"><span>3 微簡報</span><span>12 一堂課</span><span>25 大單元</span></div>
      </div>)}
      {s.mode === 'random' && (
        <div className="rollbox">
          <span className="text-xl">🎲</span>
          <div className="flex-1"><span className="font-bold text-[#92400e] text-lg">{s.rolled} 頁</span><span className="hint ml-2">（在 {COUNT_RANGE[0]}–{COUNT_RANGE[1]} 頁間抽選）</span></div>
          <button type="button" className="btn btn-ghost dice" onClick={() => setSmart('slideCount', { rolled: rollCount(s.rolled) })}><IDice size={15} />重抽</button>
        </div>
      )}
      {s.mode === 'custom' && <input className="inp" autoFocus placeholder="例：12–15 頁、依內容自動決定、主簡報 10 頁＋附錄 3 頁" value={s.custom} onChange={e => setSmart('slideCount', { custom: e.target.value })} />}
    </div>
  );
}

function GroupTools({ group, smart, setSmartAll }) {
  const keys = Object.keys(SMART_FIELDS).filter(k => SMART_FIELDS[k].group === group).concat(group === 'slides' ? ['slideCount'] : []);
  const allRandom = () => {
    const patch = {};
    keys.forEach(k => { patch[k] = { ...smart[k], mode: 'random', rolled: k === 'slideCount' ? rollCount(smart[k].rolled) : rollFrom(SMART_FIELDS[k].options, smart[k].rolled) }; });
    setSmartAll(patch);
  };
  const allPick = () => { const patch = {}; keys.forEach(k => { patch[k] = { ...smart[k], mode: 'pick' }; }); setSmartAll(patch); };
  const counts = keys.reduce((a, k) => (a[smart[k].mode]++, a), { pick: 0, random: 0, custom: 0 });
  return (
    <div className="flex flex-wrap items-center gap-2 mb-4 p-3 rounded-xl" style={{ background: '#f7f4ee' }}>
      <span className="hint mr-auto">
        共 {keys.length} 項：<span className="badge b-pick">指定 {counts.pick}</span> <span className="badge b-random">隨機 {counts.random}</span> <span className="badge b-custom">自訂 {counts.custom}</span>
      </span>
      <button type="button" className="btn btn-ghost dice" onClick={allRandom}><IDice size={15} />整組隨機</button>
      <button type="button" className="btn btn-ghost" onClick={allPick}><IReset size={15} />全部改回指定</button>
    </div>
  );
}

  const setSmartAll = (patch) => setSt(p => ({ ...p, smart: { ...p.smart, ...patch } }));

        <SmartField k="slideDensity" smart={st.smart} setSmart={setSmart} />
        <SmartField k="slideImage" smart={st.smart} setSmart={setSmart} />
        <SmartField k="slideTarget" smart={st.smart} setSmart={setSmart} />
        <SmartCount smart={st.smart} setSmart={setSmart} />
      </div>
    </Section>
  );

  const InfoCore = (
    <Section no="2" title="資訊圖表規格" sub="每一項都可「指定」、交給系統「🎲 隨機」，或「✏️ 自訂」文字">
      <GroupTools group="info" smart={st.smart} setSmartAll={setSmartAll} />
      <div className="grid md:grid-cols-2 gap-3">
        <SmartField k="infoStyle" smart={st.smart} setSmart={setSmart} />
        <SmartField k="infoLayout" smart={st.smart} setSmart={setSmart} />
        <SmartField k="infoMedia" smart={st.smart} setSmart={setSmart} />
        <SmartField k="infoColor" smart={st.smart} setSmart={setSmart} />
        <SmartField k="infoDensity" smart={st.smart} setSmart={setSmart} />
        <SmartField k="infoHierarchy" smart={st.smart} setSmart={setSmart} />
      </div>
    </Section>
  );

  const Extra = (
    <Section no="3" title="補充需求" sub="點選常用語快速加入，或自由輸入">
      <div className="flex flex-wrap gap-1.5 mb-3">
        {QUICK_NOTES.map(n => <button key={n} type="button" className="chip" onClick={() => up({ notes: st.notes.includes(n) ? st.notes : (st.notes.trim() ? st.notes.trim() + '；' : '') + n })}>＋ {n}</button>)}
      </div>
      <textarea className="txt" rows="3" placeholder="例：請以校園常見植物為例、加入一個需要學生動手的小活動…" value={st.notes} onChange={e => up({ notes: e.target.value })} />
      <div className="mt-5 pt-4 border-t" style={{ borderColor: 'var(--line)' }}>
        <button type="button" className="w-full flex items-center justify-between" onClick={() => setShowIndicators(!showIndicators)}>
          <span className="font-bold">108 課綱核心素養對應 {st.indicators.length > 0 && <span className="badge b-pick ml-1">已選 {st.indicators.length}</span>}</span>
          <span className={`transition-transform ${showIndicators ? 'rotate-180' : ''}`}><IChev /></span>
        </button>
        {showIndicators && (
          <div className="grid sm:grid-cols-2 gap-3 mt-4 rise">
            {INDICATORS.map(g => (
              <div key={g.label} className="field">
                <div className="text-xs font-bold tracking-wider mb-2" style={{ color: 'var(--ink-3)' }}>{g.label}</div>
                <div className="space-y-1.5">
                  {g.items.map(([id, d]) => { const on = st.indicators.includes(id); return (
                    <label key={id} className={`flex items-start gap-2 p-2 rounded-lg cursor-pointer ${on ? 'bg-white shadow-sm' : ''}`}>
                      <input type="checkbox" className="mt-1.5" style={{ accentColor: 'var(--accent)' }} checked={on} onChange={() => up({ indicators: on ? st.indicators.filter(x => x !== id) : [...st.indicators, id] })} />
                      <span><span className="font-bold text-sm">{id}</span><span className="hint block">{d}</span></span>
                    </label>); })}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </Section>
  );

  /* ---------- 右側摘要 ---------- */
  const summaryRows = () => {
    const rows = [];
    if (st.module === 'LESSON') { rows.push(['時長', st.duration]); rows.push(['教學法', st.method === '__custom' ? st.customMethod : st.method]); rows.push(['主軸', st.theme === '__custom' ? st.customTheme : st.theme]); }
    if (st.module === 'QUESTION') { rows.push(['題型', st.qTypes.join('、')]); rows.push(['總題數', `${total} 題`]); rows.push(['解析', st.explain]); }
    if (st.module === 'MATERIALS') { Object.entries({ style: '樣式', diff: '難度', len: '份量' }).forEach(([k, l]) => st.mat[k][0] && rows.push([l, st.mat[k][1]])); }
    return rows;
  };
  const smartKeys = st.module === 'SLIDES' ? ['slideStyle', 'slideColor', 'slideStructure', 'slideDensity', 'slideImage', 'slideTarget', 'slideCount'] : st.module === 'INFO' ? Object.keys(SMART_FIELDS).filter(k => SMART_FIELDS[k].group === 'info') : [];

  const Summary = (
    <div className="card p-5">
      <div className="flex items-center justify-between mb-3">
        <h3 className="serif font-black text-base">目前設定</h3>
        {valid ? <span className="badge b-custom">✓ 可生成</span> : <span className="badge" style={{ background: '#fde2e2', color: '#b91c1c' }}>待補必填</span>}
      </div>
      <div className="text-sm space-y-2.5">
        <div><div className="hint">學科</div><div className="font-bold">{subj.icon} {st.subject === 'custom' ? (st.customSubject || '自訂學科') : subj.name}<span className="font-normal hint ml-1">· {st.teacherRole}</span></div></div>
        <div><div className="hint">範圍</div><div className={bookText ? 'font-medium' : 'text-red-600'}>{bookText ? bookText.replace(/^\[[^\]]+\]\s*/, '') : '尚未選擇冊次'}</div><div className={chapterText ? 'font-medium' : 'text-red-600'}>{chapterText || '尚未選擇章節'}</div></div>
        {(st.grade || st.level) && <div><div className="hint">對象</div><div>{[st.grade, st.level].filter(Boolean).join('｜')}</div></div>}
        {summaryRows().filter(r => r[1]).map(([l, v]) => <div key={l}><div className="hint">{l}</div><div>{v}</div></div>)}
        {smartKeys.length > 0 && (
          <div className="pt-2 border-t space-y-1.5" style={{ borderColor: 'var(--line)' }}>
            {smartKeys.map(k => { const r = resolveSmart(st.smart, k); const label = k === 'slideCount' ? '頁數' : SMART_FIELDS[k].label; return (
              <div key={k} className="flex items-start gap-2"><span className={`badge b-${r.mode} mt-0.5`}>{MODE_LABEL[r.mode]}</span><span className="hint w-16 shrink-0 mt-0.5">{label}</span><span className="text-[0.85rem] leading-snug">{r.short || r.text}</span></div>); })}
          </div>
        )}
      </div>
      <button className="btn btn-primary w-full mt-5" disabled={!valid} onClick={generate}><IWand />生成{mod.label}提示詞</button>
      {!valid && <p className="hint text-center mt-2">請完成「冊次」與「章節」{st.module === 'QUESTION' ? '並選擇題型' : ''}</p>}
    </div>
  );

  const LINKS = [['NotebookLM', 'https://notebooklm.google.com/'], ['Gemini', 'https://gemini.google.com/'], ['Claude', 'https://claude.ai/new'], ['ChatGPT', 'https://chatgpt.com/']];

  return (
    <div style={accentStyle} className="min-h-screen pb-16">
      <header className="sticky top-0 z-30 backdrop-blur" style={{ background: 'rgba(246,243,236,.88)', borderBottom: '1px solid var(--line)' }}>
        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl flex items-center justify-center text-white serif font-black text-lg" style={{ background: 'var(--accent)' }}>教</div>
          <div className="min-w-0">
            <h1 className="serif font-black text-base sm:text-lg leading-tight truncate">全領域 AI 教學提示詞工作台</h1>
            <div className="hint hidden sm:block">108 課綱必修＋加深加廣選修內建 · 一鍵生成結構化 Prompt</div>
          </div>
          <span className="ml-auto badge b-pick hidden md:inline">Ver 4.0</span>
          <button className="btn btn-ghost" onClick={resetAll}><IReset size={15} /><span className="hidden sm:inline">重設</span></button>
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-4 pt-6">
        <nav className="grid grid-cols-5 gap-2 sm:gap-3 mb-6">
          {MODULES.map(m => (
            <button key={m.id} type="button" onClick={() => up({ module: m.id })} className={`mod ${st.module === m.id ? 'on' : ''}`} style={st.module === m.id ? { '--accent': m.color, '--accent-soft': m.soft, background: m.soft } : {}}>
              <div className="text-xl sm:text-2xl leading-none mb-1">{m.icon}</div>
              <div className="font-bold text-sm sm:text-base" style={{ color: st.module === m.id ? m.color : 'var(--ink)' }}>{m.label}</div>
              <div className="hint hidden sm:block">{m.desc}</div>
            </button>
          ))}
        </nav>

        <div className="grid lg:grid-cols-[minmax(0,1fr)_340px] gap-6 items-start">
          <div className="space-y-5">
            {Basic}
            {st.module === 'LESSON' && LessonCore}
            {st.module === 'QUESTION' && QuestionCore}
            {st.module === 'MATERIALS' && MaterialsCore}
            {st.module === 'SLIDES' && SlidesCore}
            {st.module === 'INFO' && InfoCore}
            {Extra}

            {result && (
              <section ref={resultRef} className="card overflow-hidden rise" style={{ scrollMarginTop: '80px' }}>
                <div className="flex flex-wrap items-center gap-2 px-5 py-3.5" style={{ background: 'var(--accent)', color: '#fff' }}>
                  <div className="font-black serif mr-auto">✨ {mod.label}提示詞已生成<span className="font-normal text-sm opacity-80 ml-2">{result.length} 字</span></div>
                  <button className="btn" style={{ background: '#fff', color: 'var(--accent)', padding: '.42rem .8rem', fontSize: '.85rem' }} onClick={copy}>{copied ? <><ICheck size={15} />已複製</> : <><ICopy size={15} />複製</>}</button>
                  <button className="btn" style={{ background: 'rgba(255,255,255,.18)', color: '#fff', padding: '.42rem .8rem', fontSize: '.85rem' }} onClick={download}><IDown size={15} />下載 .txt</button>
                  <button className="btn" style={{ background: 'rgba(255,255,255,.18)', color: '#fff', padding: '.42rem .8rem', fontSize: '.85rem' }} onClick={generate}><IDice size={15} />重新生成</button>
                </div>
                <textarea className="prompt-out w-full p-5 outline-none border-0 resize-y" style={{ minHeight: '360px', background: '#fffdf8' }} value={result} onChange={e => setResult(e.target.value)} />
                <div className="flex flex-wrap items-center gap-2 px-5 py-3 border-t" style={{ borderColor: 'var(--line)' }}>
                  <span className="hint mr-auto">可直接在上方修改文字；複製後貼到 AI 工具，並附上課本或講義 PDF</span>
                  {LINKS.map(([n, u]) => <a key={n} href={u} target="_blank" rel="noreferrer" className="chip">{n}<IExt size={13} /></a>)}
                </div>
              </section>
            )}
          </div>

          <aside className="lg:sticky lg:top-24 space-y-4">
            {Summary}
            <div className="card p-5 text-sm">
              <h4 className="serif font-black mb-2">使用小提醒</h4>
              <ol className="list-decimal pl-5 space-y-1.5" style={{ color: 'var(--ink-2)' }}>
                <li>上方切換五種模組，學科與單元設定會共用。</li>
                <li>簡報、資訊圖表的每一項都能選<b>指定</b>、<b>🎲 隨機</b>或<b>✏️ 自訂</b>；想找靈感時按「整組隨機」。</li>
                <li>設定會自動記在這台電腦的瀏覽器，下次打開仍在。</li>
              </ol>
            </div>
          </aside>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
