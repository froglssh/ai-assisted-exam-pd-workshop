          const colorOpt = INFOGRAPHIC_COLOR_OPTIONS.find(o => o.value === formData.infographicColor) || INFOGRAPHIC_COLOR_OPTIONS[0];
          const targetMediaOpt = INFOGRAPHIC_TARGET_MEDIA.find(m => m.value === formData.infographicTargetMedia) || INFOGRAPHIC_TARGET_MEDIA[0];

          prompt += `【任務：設計 ${subjectName} 資訊圖表企劃 (Infographic Specification)】\n請根據來源資料，將「${selectedChapter}」的核心概念與複雜邏輯轉化為一張專業資訊圖表的設計企劃案。\n\n**圖表設計規格參數**：\n- 視覺藝術風格：${styleVal}\n- 核心結構佈局：${layoutOpt.label} (${layoutOpt.keywords})\n- 資訊呈現密度：${densityOpt.label}\n- 視覺層次引導：${hierarchyOpt.label}\n- 色彩視覺策略：${colorOpt.label}\n- 產出目標媒介：${targetMediaOpt.label}\n`;

          prompt += `\n**詳細企劃內容要求**：\n1. **主標題與副標題**：最具吸引力與點出本單元核心精神的文案。\n2. **中央核心視覺結構 (Core Visual)**：詳細描述視圖中央的軸線、圖像或佈局動線 (例如以 ${layoutOpt.label} 呈現觀念推進)。\n3. **資訊區塊劃分 (Content Sections)**：條列圖表上必須標註的 3-5 個關鍵概念、數據或關係連結。\n4. **提示詞與代碼生成 (Image/Code Prompt)**：\n   - 若媒介為 AI 繪圖提示詞，請提供英文 Prompt (適用 Midjourney / FLUX)；\n   - 若為 Mermaid/HTML，請提供精準可執行之語法與程式碼範例。\n`;
          
        } else {
          prompt += `【任務：製作 ${subjectName} 補充學習教材】\n請根據來源資料，為「${selectedChapter}」製作一份適合高中生自主學習的${formData.enableMaterialStyle ? `「${formData.materialStyle}」` : '補充講義'}。\n\n**規格設定**：\n`;
          if (formData.enableMaterialDifficulty) prompt += `- 難度層次：${formData.materialDifficulty}\n`;
          if (formData.enableMaterialLength) prompt += `- 份量規劃：${formData.materialLength}\n`;
          if (formData.enableMaterialSource && formData.materialSource.length > 0) prompt += `- 參考重點資源：${formData.materialSource.join('、')}\n`;

          prompt += `\n**內容必備元素**：\n`;
          if (formData.enableKeywords) prompt += `1. **核心專有名詞**：請依「${formData.keywordsFormat}」格式整理重點名詞${formData.customKeywords ? ` (特別包含：${formData.customKeywords})` : ''}。\n`;
          if (formData.enableTables) prompt += `2. **比較與圖解表格**：請設計一個「${formData.tablesFormat}」來釐清易混淆觀念。\n`;
          if (formData.enableExamples) prompt += `3. **典範例題與導引**：提供 3 題「${formData.examplesFormat}」並解密思維路徑。\n`;
          if (formData.enablePractice) prompt += `4. **隨堂鞏固練習**：提供 3 題「${formData.practiceFormat}」。\n`;
        }

        if (formData.customRequirements && formData.customRequirements.trim() !== '') {
            prompt += `\n**特別叮嚀與特殊需求**：\n${formData.customRequirements}\n`;
        }
        return prompt;
      };

      const handleGenerate = () => {
        setIsGenerating(true);
        setCopyStatus('idle');
        setTimeout(() => {
            const userPrompt = constructPrompt();
            setResult(userPrompt);
            setIsGenerating(false);
            setTimeout(() => { document.getElementById('result-area')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
        }, 400);
      };

      const handleCopy = async () => {
        if (!result) return;
        try {
          if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(result);
          } else {
              let textArea = document.createElement("textarea");
              textArea.value = result;
              textArea.style.position = "fixed";
              textArea.style.left = "-999999px";
              document.body.appendChild(textArea);
              textArea.focus();
              textArea.select();
              document.execCommand('copy');
              textArea.remove();
          }
          setCopyStatus('copied');
          setTimeout(() => setCopyStatus('idle'), 2000);
        } catch (err) {
          console.error("Failed to copy text: ", err);
          alert("複製失敗，請手動全選複製。");
        }
      };

      const currentSubjectObj = SUBJECT_CATEGORIES.find(s => s.id === formData.subject) || SUBJECT_CATEGORIES[0];

      return (
        <div className="min-h-screen pb-12 font-sans text-slate-800">
          <header className="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                 <div className="w-9 h-9 bg-gradient-to-br from-indigo-500 to-blue-600 rounded-xl flex items-center justify-center text-white font-bold shadow-md">All</div>
                 <h1 className="text-xl font-bold text-slate-800 tracking-wide">高中全領域 AI 教學課程提示詞生成平台</h1>
              </div>
              <div className="text-sm font-medium text-slate-500 bg-slate-100 px-3 py-1 rounded-full hidden sm:block">
                Ver 3.0 Universal (NotebookLM & Gemini Ready)
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-8">
            <div className="bg-gradient-to-r from-blue-700 via-indigo-700 to-purple-800 rounded-2xl p-7 text-white mb-8 shadow-lg relative overflow-hidden">
              <div className="absolute top-0 right-0 -mt-10 -mr-10 opacity-10"><Boxes size={220} /></div>
              <div className="relative z-10">
                <div className="inline-block px-3 py-1 bg-white/20 rounded-full text-xs font-semibold mb-2 backdrop-blur-sm">
                  跨學科通用 Edition • 內建 108 課綱部定必修 & 加深加廣選修 • 保留老師自訂彈性
                </div>
                <h2 className="text-2xl font-bold mb-3 flex items-center gap-2"><Check size={28}/> 全科目 AI 結構化提示詞助手</h2>
                <p className="opacity-90 max-w-3xl leading-relaxed text-sm">
                  系統已完整內建教育部 108 課綱各科目之「部定必修」與「加深加廣選修」課程單元與章節，同時保留老師可自行自由設定冊次與主題的選項。
                  無論您任教國文、英文、數學、自然科學（物化生地）、社會科學（歷地公）、資訊與生活科技或藝能跨領域，均能一鍵生成結構化 Prompt！
                </p>
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
              <div className="lg:col-span-8 space-y-6">
                <div className="flex space-x-1 overflow-x-auto pb-2 border-b-2 border-slate-200 custom-scrollbar">
                  {TAB_CONFIG.map(tab => {
                    const Icon = tab.icon;
                    const isActive = activeTab === tab.id;
                    return (
                      <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center gap-2 px-5 py-3.5 text-sm font-semibold rounded-t-xl transition-all whitespace-nowrap transform ${isActive ? 'bg-white border-b-2 border-blue-500 text-blue-600 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] translate-y-[2px]' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-100'}`}>
                        <Icon size={18} className={isActive ? tab.color : ''} />{tab.label}
                      </button>
                    );
                  })}
                </div>

                <GeneratorForm type={activeTab} state={formData} onChange={handleUpdateState} onGenerate={handleGenerate} isGenerating={isGenerating} />

                {result && (
                  <div id="result-area" className="space-y-4 animate-fade-in pt-4">
                     <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl relative overflow-hidden group">
                        <div className="absolute top-0 right-0 p-4 bg-gradient-to-l from-slate-900 to-transparent w-full h-16 pointer-events-none"></div>
                        <div className="flex items-center justify-between mb-4 border-b border-slate-800 pb-4 relative z-10">
                          <h3 className="text-lg font-bold text-slate-100 flex items-center gap-2">
                            <span className="w-2.5 h-2.5 bg-green-400 rounded-full animate-pulse shadow-[0_0_8px_rgba(74,222,128,0.8)]"></span>
                            已生成的通用結構化提示詞 (Universal Structured Prompt)
                          </h3>
                          <button onClick={handleCopy} className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-all ${copyStatus === 'copied' ? 'bg-green-500 text-white shadow-md' : 'bg-slate-700 text-slate-300 hover:bg-slate-600 hover:text-white shadow-md'}`}>
                            {copyStatus === 'copied' ? <><Check size={16} /> 已複製！</> : <><Copy size={16} /> 複製提示詞</>}
                          </button>
                        </div>
                        <div className="font-mono text-sm md:text-base leading-relaxed text-slate-200 whitespace-pre-wrap break-words max-h-[500px] overflow-y-auto pr-2 custom-scrollbar select-all">
                          {result}
                        </div>
                        <div className="mt-4 pt-4 border-t border-slate-800 flex flex-col sm:flex-row items-start sm:items-center justify-between text-sm text-slate-400 gap-3">
                          <span className="flex items-center gap-2"><Info size={16}/> 下一步：複製上方提示詞，貼入 NotebookLM 對話框並附上講義/課本 PDF</span>
                          <a href="https://notebooklm.google.com/" target="_blank" rel="noreferrer" className="flex items-center gap-1 text-blue-400 hover:text-blue-300 transition-colors font-medium bg-blue-500/10 px-3 py-1.5 rounded-full">
                            前往 NotebookLM <ExternalLink size={14} />
                          </a>
                        </div>
                     </div>
                  </div>
                )}
              </div>

              <div className="lg:col-span-4">
                 <div className="space-y-6 lg:space-y-0 lg:sticky lg:top-24 lg:h-[calc(100vh-8rem)] lg:flex lg:flex-col gap-6">
                  <div className="lg:flex-none">
                     <PreviewPanel state={formData} />
                  </div>
                  <div className="lg:flex-1 lg:overflow-y-auto lg:pr-1 lg:custom-scrollbar lg:pb-4">
                    <div className="bg-blue-50 border border-blue-100 rounded-xl p-5 shadow-sm">
                      <h4 className="font-bold text-blue-800 mb-2 flex items-center gap-2">🚀 通用提示詞高效使用指南</h4>
                      <ol className="text-sm text-blue-800/80 list-decimal pl-4 space-y-3">
                        <li><strong>學科與範圍</strong>：選擇任教學科與冊次/章節（亦可直接輸入自訂單元）。</li>
                        <li><strong>簡報與圖表風格</strong>：內建包含 Apple 極簡發表會風、TED 故事風、包豪斯現代風、黑板手繪風、玻璃擬態風等 28+ 款簡報風格與 16+ 款資訊圖表風格。</li>
                        <li><strong>複製並執行</strong>：
                          <ul className="list-disc pl-4 mt-1 text-xs opacity-90">
                            <li>推薦複製提示詞貼入 <strong>NotebookLM</strong> 並上傳課本或講義 PDF，獲得精準解答與豐富素材！</li>
                          </ul>
                        </li>
                      </ol>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
